<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>演習: リアルタイム同期</title>
    <style>
      #messages {
        height: 300px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
      }
      .message {
        padding: 5px;
        margin: 5px 0;
        background: #f0f0f0;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>リアルタイムメッセージ</h1>
    <div id="messages"></div>
    <form>
      <input type="text" name="message" placeholder="メッセージを入力" />
      <button>送信</button>
    </form>
    <script type="module" src="./practice-event.js"></script>
  </body>
